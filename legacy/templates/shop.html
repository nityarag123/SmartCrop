{% extends 'base.html' %}{% block content %}<section class="page-head"><p class="eyebrow">FARM SUPPLIES</p><h1>Care for every crop</h1></section><section class="grid">{% for product in products %}<article class="product"><span>{{ product.icon }}</span><p class="eyebrow">{{ product.category }}</p><h2>{{ product.name }}</h2><p>{{ product.description }}</p><strong>₹{{ '%.0f'|format(product.price) }}</strong><form method="post" action="{{ url_for('add_to_cart', product_id=product.id) }}"><button>Add to cart</button></form></article>{% endfor %}</section>{% endblock %}

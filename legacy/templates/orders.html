{% extends 'base.html' %}{% block content %}<section class="page-head"><h1>Order history</h1></section>{% if orders %}<table><tr><th>Order</th><th>Date</th><th>Status</th><th>Total</th></tr>{% for order in orders %}<tr><td><a href="{{ url_for('order_detail', order_id=order.id) }}>#{{ order.id }}</a></td><td>{{ order.created_at }}</td><td>{{ order.status }}</td><td>₹{{ '%.0f'|format(order.total) }}</td></tr>{% endfor %}</table>{% else %}<p>No orders yet. <a href="{{ url_for('shop') }}">Visit the shop</a>.</p>{% endif %}{% endblock %}

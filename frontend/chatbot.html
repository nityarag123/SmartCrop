<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="nav.chat">Farm Assistant — SmartCrop</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/chatbot.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-auth="required">

  <header class="site-header" id="site-header"></header>

  <main class="container chat-page">
    <div class="chat-shell">
      <div class="chat-head">
        <span class="ch-ico">🤖</span>
        <div><b data-i18n="chat.name">SmartCrop Farm Assistant</b><span data-i18n="chat.status">Online · Ask in your language</span></div>
        <div class="chat-tools">
          <button id="listen-toggle" title="Voice input">🎤 <span id="listen-label" data-i18n="chat.speak">Speak</span></button>
          <button id="speak-toggle" title="Text to speech">🔊</button>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages"></div>

      <div class="chat-suggestions" id="chat-suggestions"></div>

      <div class="chat-input-bar">
        <input class="input" type="text" id="chat-input" data-i18n="chat.placeholder" placeholder="Type your question here…">
        <button id="chat-send" title="Send" aria-label="Send">➤</button>
      </div>
    </div>
    <p class="chat-hint" data-i18n="chat.hint">Ask about crops, pests, fertilisers, schemes or weather. Bot replies may use demo data.</p>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/main.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>

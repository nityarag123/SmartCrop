<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="nav.crop">Recommend Crop — SmartCrop</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-auth="required">

  <header class="site-header" id="site-header"></header>

  <main class="container" style="padding: 28px 0;">
    <div class="page-head">
      <div>
        <h1 data-i18n="crop.title">AI Crop Recommendation</h1>
        <p class="muted" data-i18n="crop.subtitle">Enter your field's soil &amp; climate details — the AI suggests the best crop</p>
      </div>
    </div>

    <div class="work-grid">
      <div class="card">
        <div class="flex-between" style="align-items:center;margin-bottom:14px;">
          <h3 style="margin:0;" data-i18n="crop.enterDetails">Enter field details</h3>
          <button class="btn btn-outline btn-sm" type="button" id="crop-geo" data-i18n="crop.detectLocation">📍 Use my location</button>
        </div>
        <div id="crop-alert"></div>
        <form id="crop-form">
          <div class="form-group"><label for="temperature">Temperature (°C)</label><input class="input" type="number" id="temperature" step="any" value="28" required></div>
          <div class="form-group"><label for="humidity">Humidity (%)</label><input class="input" type="number" id="humidity" step="any" value="65" required></div>
          <div class="form-group"><label for="rainfall">Rainfall (mm)</label><input class="input" type="number" id="rainfall" step="any" value="120" required></div>
          <div class="form-group"><label for="ph">Soil pH</label><input class="input" type="number" id="ph" step="0.1" min="0" max="14" value="6.5" required></div>
          <div class="form-group"><label for="nitrogen">Nitrogen (N)</label><input class="input" type="number" id="nitrogen" step="any" value="45" required></div>
          <div class="form-group"><label for="phosphorus">Phosphorus (P)</label><input class="input" type="number" id="phosphorus" step="any" value="35" required></div>
          <div class="form-group"><label for="potassium">Potassium (K)</label><input class="input" type="number" id="potassium" step="any" value="40" required></div>
          <button class="btn btn-primary btn-block btn-lg" type="submit" id="crop-btn" data-i18n="crop.recommendBtn">Recommend Crop</button>
        </form>
      </div>

      <div class="work-results" id="crop-result"></div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/main.js"></script>
  <script src="js/crop.js"></script>
</body>
</html>

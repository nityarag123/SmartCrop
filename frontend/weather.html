<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="nav.weather">Weather — SmartCrop</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-auth="required">

  <header class="site-header" id="site-header"></header>

  <main class="container" style="padding: 28px 0;">
    <div class="page-head">
      <div>
        <h1 data-i18n="weather.title">Weather &amp; Farm Advice</h1>
        <p class="muted" data-i18n="weather.subtitle">Current conditions, 5-day forecast and farming tips</p>
      </div>
      <form class="search-box" id="weather-search" style="flex:1 1 340px;">
        <input class="input" id="weather-location" data-i18n="weather.placeholder" placeholder="Enter location, e.g. Pune, Maharashtra">
        <button class="icon-btn" type="button" id="weather-geo" title="Use my location" aria-label="Use my location" style="border-color:var(--green-400);">📍</button>
        <button class="btn btn-primary" type="submit" data-i18n="common.search">Search</button>
      </form>
    </div>

    <div id="weather-alert"></div>
    <div id="weather-loading"><div class="spinner"></div></div>

    <!-- Current -->
    <div id="weather-current" class="hidden"></div>

    <!-- Forecast -->
    <div class="section-title mt-4"><h2 data-i18n="weather.forecast">5-Day Forecast</h2><span class="muted" id="forecast-tag"></span></div>
    <div class="grid grid-5" id="weather-forecast"></div>

    <!-- Advice -->
    <div class="section-title mt-4"><h2 data-i18n="weather.advice">Farming Advice</h2></div>
    <div class="card" id="weather-advice"><span class="muted">Loading advice…</span></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/main.js"></script>
  <script src="js/weather.js"></script>
</body>
</html>

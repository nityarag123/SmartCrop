<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="auth.loginTitle">Login — SmartCrop</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-auth="optional">

  <header class="site-header" id="site-header"></header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="brand-wrap">
        <img src="assets/icons/logo.svg" alt="SmartCrop logo">
        <h1 data-i18n="auth.loginTitle">Welcome back</h1>
        <p class="sub" data-i18n="auth.loginSub">Login to your SmartCrop account</p>
      </div>

      <div id="auth-alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email" data-i18n="auth.email">Email</label>
          <input class="input" type="email" id="email" name="email" autocomplete="email" data-i18n="auth.emailPh" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="password" data-i18n="auth.password">Password</label>
          <div class="password-wrap">
            <input class="input" type="password" id="password" name="password" autocomplete="current-password" data-i18n="auth.passwordPh" placeholder="Your password">
            <button type="button" class="eye-btn" id="toggle-pass" aria-label="Show password">👁</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="login-btn" data-i18n="nav.login">Login</button>
      </form>

      <div class="auth-switch" data-i18n="auth.noAccount">New to SmartCrop?</div>
      <div class="auth-switch"><a href="register.html" data-i18n="auth.createAccount">Create a free account</a></div>

      <div class="divider" data-i18n="auth.or"></div>
      <a class="btn btn-outline btn-block" href="index.html" data-i18n="auth.backHome">← Back to Home</a>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
